<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Before paint: concrete theme (light/dark) and UI language. See lib/client/theme.svelte.ts and lib/i18n.
			(function () {
				var root = document.documentElement;
				try {
					var t = localStorage.getItem('mai.theme');
					var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					root.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					root.dataset.theme = 'light';
				}
				try {
					var l = localStorage.getItem('mai.lang');
					if (l !== 'es' && l !== 'en') {
						var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
						l = 'en';
						for (var i = 0; i < langs.length; i++) if (/^es\b/i.test(langs[i])) l = 'es';
					}
					root.lang = l;
				} catch (e) {}
			})();
			// The browser may offer install before the app boots: keep the event (lib/client/install.svelte.ts).
			addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__maiInstall = e;
			});
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Mai" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
